# NGINX - Balanceo de carga activo-pasivo entre nodos Express
# Failover: si el nodo primario falla, el secundario asume el tráfico

upstream express_backend {
    # Nodo primario (activo)
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s weight=10;

    # Nodo secundario (pasivo / backup)
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s backup;

    keepalive 64;
}

upstream ai_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name adaptive-exercise.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name adaptive-exercise.local;

    # TLS 1.3 forzado
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_certificate     /etc/ssl/certs/adaptive-exercise.crt;
    ssl_certificate_key /etc/ssl/private/adaptive-exercise.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Encabezados de seguridad
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    client_max_body_size 10M;

    # Health check endpoint
    location /health {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # API REST Node.js
    location /api/ {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy directo al microservicio IA (opcional)
    location /ai/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
